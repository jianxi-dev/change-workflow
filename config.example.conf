# =============================================================================
# change-workflow 配置模板
#
# 用法：复制为 <目标项目>/.change-workflow.conf（setup.sh 会自动生成）
#   cp config.example.conf /path/to/project/.change-workflow.conf
# 脚本与 agent 会 source / 读取该文件。所有值均可按项目调整。
#
# 本文件由 setup.sh / update.sh 共同维护；升级工具包**不会覆盖它**。
# =============================================================================

# --- 工具包版本（由 setup.sh / update.sh 自动维护，勿手改）---
TOOLKIT_VERSION="1.1.0"                 # 安装或上次升级到的工具包版本；update.sh --check 据此比对
EFFECTIVE_DATE="YYYY-MM-DD"             # 首次安装日期；升级时沿用，不重戳
REPO_ROOT="/abs/path/to/repo"           # 安装时仓库根的绝对路径（替换 {{REPO_ROOT}} 用）

# --- 仓库 ---
REPO="owner/name"                       # 例：gh repo view --json nameWithOwner -q .nameWithOwner
OWNER="owner"                           # 由 REPO 推导；替换 {{OWNER}} 用
DEFAULT_BRANCH="main"                   # 替换 {{DEFAULT_BRANCH}} 用

# --- 看板（GitHub Project V2）---
# setup.sh 自动发现并回填；也可手动填（GraphQL: node(id:PROJECT_ID){...on ProjectV2{fields{...on ProjectV2SingleSelectField{name id options{id name}}}}})
PROJECT_ID="PVT_xxxxxxxxxxxx"
STATUS_FIELD_ID="PVTSSF_xxxxxxxxxxxx"
OPT_BACKLOG="xxxxxxxx"
OPT_READY="xxxxxxxx"
OPT_IN_PROGRESS="xxxxxxxx"
OPT_DONE="xxxxxxxx"

# --- 标签（若目标项目用不同命名，改这里）---
LABEL_READY="ready-for-agent"
LABEL_NEEDS_TRIAGE="needs-triage"
LABEL_NEEDS_INFO="needs-info"
LABEL_READY_HUMAN="ready-for-human"
LABEL_WONTFIX="wontfix"
LABEL_RISK_LOW="risk-low"
LABEL_RISK_MEDIUM="risk-medium"
LABEL_RISK_HIGH="risk-high"
LABEL_SOURCE="ai-generated"
LABEL_CLOSURE_PENDING="change-close-pending"

# --- 缺陷票模块标签（逗号分隔，用于 bug.yml / 缺陷票）---
MODULE_LABELS="module-a,module-b,module-c"

# --- 质量门禁命令（四件套；留空 = 跳过该步）---
CMD_TYPECHECK="pnpm -r typecheck"
CMD_LINT="pnpm -r lint"
CMD_TEST="pnpm -r test"
CMD_E2E=""                              # 例："pnpm --filter web test:e2e"（涉 e2e 时手动跑，脚本不内置）

# --- 目录约定（相对仓库根）---
SKILLS_DIR=".opencode/skills"           # change-workflow skill 安装位置
DOCS_DIR="docs/agents"                  # 规范文档位置

# --- openspec（可选；false 时 G0 阶段二/ G4 归档降级为跳过）---
OPENSPEC_ENABLED="true"
