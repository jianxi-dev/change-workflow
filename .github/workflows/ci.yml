name: CI

# 工具包自身的质量门禁。搬家前先有 CI —— 本仓库此前靠人工端到端测试，
# 两个真实缺陷（manifest 基线被重写、$VAR 紧邻全角字符致 --force 不可用）都是那样才发现的。

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: bash 语法检查
        run: |
          fail=0
          for s in setup.sh update.sh lib/render.sh scripts/*.sh test/*.sh; do
            [ -f "$s" ] || continue
            if bash -n "$s"; then echo "✅ $s"; else echo "❌ $s"; fail=1; fi
          done
          exit $fail

      - name: shellcheck
        run: |
          if ! command -v shellcheck >/dev/null; then
            echo "shellcheck 不可用，跳过"; exit 0
          fi
          # 仅报 error/warning；info/style 不阻断
          # 用 scripts/*.sh glob 而非显式清单：新增脚本（cw-update/cw-evidence/cw-greploop）
          # 自动纳入检查，避免再次遗漏；[ -f ] 守卫由 shellcheck 自身对缺失文件报错兜底
          shellcheck --severity=warning -x \
            setup.sh update.sh lib/render.sh scripts/*.sh test/*.sh

      - name: bash 3.2 兼容性（静态）
        run: |
          # CI runner 是 bash 5，macOS 自带 /bin/bash 是 3.2。
          # bash 4+ 特性在 CI 上永远绿，到 macOS 才炸 —— 必须静态拦截。
          fail=0
          for f in setup.sh update.sh lib/render.sh scripts/*.sh test/*.sh; do
            [ -f "$f" ] || continue
            hits="$(grep -vE '^[[:space:]]*#' "$f" | grep -nE 'local -n |declare -A|mapfile|readarray' || true)"
            if [ -n "$hits" ]; then
              echo "❌ $f 使用 bash 4+ 特性（macOS /bin/bash 3.2 不支持）:"
              echo "$hits"
              fail=1
            fi
          done
          [ "$fail" -eq 0 ] && echo "✅ 无 bash 4+ 特性（脚本可在 bash 3.2 运行）"
          exit $fail

      - name: 占位符与替换表一致性
        run: |
          used="$(grep -rho '{{[A-Z_]*}}' docs/agents skills | sort -u)"
          # lib/render.sh 里占位符写成 \{\{X\}\}（转义花括号，防止 bash brace expansion 先行破坏替换），
          # 故取已登记表前须先用 sed 剥掉反斜杠，否则 grep 一无所获、全部占位符都会被误报为未登记。
          known="$(sed 's/\\//g' lib/render.sh | grep -o '{{[A-Z_]*}}' | sort -u)"
          missing="$(comm -23 <(echo "$used") <(echo "$known"))"
          if [ -n "$missing" ]; then
            echo "❌ 模板使用了未在 lib/render.sh 登记的占位符:"; echo "$missing"; exit 1
          fi
          echo "✅ 占位符全部有替换表覆盖"

      - name: 模板头一致性
        run: |
          # 以受管清单（render.sh 的 cw_list_files）为准，不用目录 glob：
          # docs/agents/AGENTS.md 是目录级知识库，不是受管模板，不该要求模板头。
          fail=0
          while IFS='|' read -r tpl _dst; do
            case "$tpl" in *.md) ;; *) continue ;; esac
            [ -f "$tpl" ] || continue
            head -1 "$tpl" | grep -q "工具包模板" || { echo "❌ 缺模板头: $tpl"; fail=1; }
          done < <(bash -c 'source lib/render.sh; cw_list_files')
          [ "$fail" -eq 0 ] && echo "✅ 受管模板头齐全"
          exit $fail

      - name: 受管模板以换行结尾
        run: |
          # cw_render 用 awk print，必然给输出补一个结尾换行。模板自身缺结尾换行时，
          # 渲染产物比直接 cp 的模板多 1 字节 → 接管模式永远无法归一（v1.2.0 抓到的真实缺陷）。
          fail=0
          while IFS='|' read -r tpl _dst; do
            [ -f "$tpl" ] || continue
            if [ -n "$(tail -c 1 "$tpl")" ]; then echo "❌ 缺结尾换行: $tpl"; fail=1; fi
          done < <(bash -c 'source lib/render.sh; cw_list_files')
          [ "$fail" -eq 0 ] && echo "✅ 受管模板均以换行结尾"
          exit $fail

      - name: 无仓库特有值残留
        run: |
          # 排除 AGENTS.md：目录级知识库本就需要指名下列禁串（它是规则文本，不会被安装到消费仓）
          hits="$(grep -rl 'jianxi-dev/md-bundle\|jianxi-dev/mdpkg\|jianxi-dev/clairis\|/Users/mason\|PVT_kwDO\|PVTSSF_' \
               docs/agents skills scripts workflows 2>/dev/null | grep -v 'AGENTS\.md$' || true)"
          if [ -n "$hits" ]; then
            echo "❌ 模板含仓库特有值（安装到其它仓库会指向错误目标）:"; echo "$hits"; exit 1
          fi
          echo "✅ 无仓库特有值残留"

      - name: 安装/升级 端到端测试
        run: ./test/install-update-e2e.sh
